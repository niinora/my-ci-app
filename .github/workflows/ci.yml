name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '18'  
    - run: npm install
    - name: Start server and run tests
      run: |
        node index.js &
        sleep 3
        npm test
      env:
        CI: true